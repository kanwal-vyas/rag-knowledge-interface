[project]
name = "hh-goa-rag"
version = "0.1.0"
description = "HH Goa 2026 Task 2 — Voice-enabled multilingual RAG over ai4bharat/MSMARCO-XI. Bootstrap/scaffolding stage — pipeline not yet implemented."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "qdrant-client>=1.11,<2",
    "sentence-transformers>=3.1,<4",
    "rank-bm25>=0.2.2,<0.3",
    "structlog>=24.4,<25",
    "python-dotenv>=1.0,<2",
    # Runtime dependencies for API providers:
    "httpx>=0.27,<0.28",           # Sarvam STT API calls
    "openai>=1.0,<2",              # DeepSeek generation (OpenAI-compatible)
    "python-multipart>=0.0.9",     # FastAPI file upload support
    "google-genai>=1.0,<3",         # Gemini generation (google-genai SDK)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "retrieval*", "embeddings*", "generation*", "guardrails*", "evaluation*", "benchmark*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
